<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shortlist — Sign in</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #ffffff;
      --text-primary: #000000;
      --text-secondary: #000000;
      --text-muted: #000000;
      --border: #000000;
      --border-mid: #000000;
      --accent: #000000;
      --accent-fg: #ffffff;
      --danger: #000000;
      --danger-bg: #ffffff;
      --success: #000000;
      --success-bg: #ffffff;
      --radius-md: 0;
      --radius-lg: 0;
      --font: "MS Sans Serif", Tahoma, Arial, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
      margin-bottom: 16px;
    }

    .logo-mark {
      width: 24px;
      height: 24px;
      border: 2px solid #000000;
      display: inline-grid;
      place-items: center;
      font-size: 15px;
      line-height: 1;
      font-weight: 700;
      background: #ffffff;
      color: #000000;
    }

    .card {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      width: 100%;
      max-width: 400px;
    }

    .tabs {
      display: flex;
      margin: -14px -14px 16px;
      border-bottom: 2px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      border-right: 2px solid var(--border);
      user-select: none;
    }

    .tab.active {
      background: #000000;
      color: #ffffff;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 16px;
    }

    label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0;
      font-weight: 500;
      background: #ffffff;
      display: inline-block;
      width: fit-content;
      padding: 0 4px;
      margin-left: 8px;
      margin-bottom: -7px;
      position: relative;
      z-index: 2;
    }

    input {
      height: 40px;
      border: none;
      border-bottom: 2px solid var(--border-mid);
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 14px;
      padding: 0 12px;
      font-family: var(--font);
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }

    input:focus { outline: none; }

    .btn {
      width: 100%;
      height: 42px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      border: 2px solid #000000;
      background: var(--accent);
      color: var(--accent-fg);
      margin-top: 4px;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 1; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-secondary {
      background: #ffffff;
      color: #000000;
      margin-bottom: 12px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 14px 0;
      font-size: 12px;
      color: #000000;
      text-transform: uppercase;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 2px;
      background: #000000;
      flex: 1;
    }

    .alert {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      margin-bottom: 16px;
      line-height: 1.4;
      border: 2px solid #000000;
    }

    .alert.error   { background: var(--danger-bg);  color: var(--danger);  }
    .alert.success { background: var(--success-bg); color: var(--success); }
    .alert.hidden  { display: none; }

    .foot { display: none; }
  </style>
</head>
<body>

  <div class="brand"><span class="logo-mark">S</span>Shortlist</div>

  <div class="card">
    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">Sign in</div>
      <div class="tab" id="tab-signup" onclick="switchTab('signup')">Create account</div>
    </div>

    <div id="alert" class="alert hidden"></div>

    <!-- Login panel -->
    <div class="panel active" id="panel-login">
      <button class="btn btn-secondary" onclick="handleGoogle()">Continue with Google</button>
      <div class="divider">or</div>
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" />
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" />
      </div>
      <button class="btn" id="loginBtn" onclick="handleLogin()">Sign in</button>
    </div>

    <!-- Signup panel -->
    <div class="panel" id="panel-signup">
      <button class="btn btn-secondary" onclick="handleGoogle()">Continue with Google</button>
      <div class="divider">or</div>
      <div class="field">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" />
      </div>
      <div class="field">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" />
      </div>
      <button class="btn" id="signupBtn" onclick="handleSignup()">Create account</button>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://mjmgwwhzovqnvedisaow.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qbWd3d2h6b3ZxbnZlZGlzYW93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MTQ4MjQsImV4cCI6MjA5NDA5MDgyNH0.IpscZzKQWvozWkJgwSiJYC5rBRBcMOnqnJohCgtohIw';

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

  // Redirect if already logged in
  sb.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'app.html';
  });

  let currentTab = 'login';

  function switchTab(tab) {
    currentTab = tab;

    document.getElementById('tab-login').classList.toggle('active',  tab === 'login');
    document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
    document.getElementById('panel-login').classList.toggle('active',  tab === 'login');
    document.getElementById('panel-signup').classList.toggle('active', tab === 'signup');

    hideAlert();
  }

  function showAlert(msg, type) {
    const el = document.getElementById('alert');
    el.textContent = msg;
    el.className = 'alert ' + type;
  }

  function hideAlert() {
    document.getElementById('alert').className = 'alert hidden';
  }

  function getAppRedirectUrl() {
    return new URL('app.html', window.location.href).href;
  }

  async function handleGoogle() {
    hideAlert();

    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: getAppRedirectUrl()
      }
    });

    if (error) showAlert(error.message, 'error');
  }

  async function handleLogin() {
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn      = document.getElementById('loginBtn');

    hideAlert();

    if (!email || !password) {
      showAlert('Please fill in your email and password.', 'error');
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'Signing in...';

    const { error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      showAlert(error.message, 'error');
      btn.disabled    = false;
      btn.textContent = 'Sign in';
    } else {
      window.location.href = 'app.html';
    }
  }

  async function handleSignup() {
    const email    = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const btn      = document.getElementById('signupBtn');

    hideAlert();

    if (!email || !password) {
      showAlert('Please fill in your email and password.', 'error');
      return;
    }

    if (password.length < 8) {
      showAlert('Password must be at least 8 characters.', 'error');
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'Creating account...';

    const { error } = await sb.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo: getAppRedirectUrl()
      }
    });

    if (error) {
      showAlert(error.message, 'error');
      btn.disabled    = false;
      btn.textContent = 'Create account';
    } else {
      showAlert('Account created! Check your email to confirm, then sign in.', 'success');
      btn.disabled    = false;
      btn.textContent = 'Create account';
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (currentTab === 'login') handleLogin();
    else handleSignup();
  });
</script>
</body>
</html>
